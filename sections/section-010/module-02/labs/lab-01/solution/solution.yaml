apiVersion: v1
kind: Namespace
metadata:
  name: team-beta
  labels:
    platform.starfleet.example/tenant: beta
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: team-beta
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: team-beta
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
      default:
        memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: team-beta
spec:
  podSelector: {}
  policyTypes:
    - Ingress
