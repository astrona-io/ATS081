# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Harden The EnvironmentRequest API (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-081-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state, including the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: class-enum
      description: "Classes small and medium are accepted and any other class is rejected"
      type: file
      source: validation/validate-class-enum.sh
      hint: "Add an enum to spec.class in the CRD schema. The API server needs a few seconds to use the new schema."
    - name: defaults
      description: "A request with only an owner gets class small and ttlHours 24"
      type: file
      source: validation/validate-defaults.sh
      hint: "Add default values to spec.class and spec.ttlHours in the schema."
    - name: ttl-bounds
      description: "ttlHours accepts 1 to 72 and rejects 0 and 100"
      type: file
      source: validation/validate-ttl-bounds.sh
      hint: "Add minimum: 1 and maximum: 72 to spec.ttlHours."
    - name: owner-rule
      description: "An owner without the suffix -team is rejected with the message \"owner must end with -team\""
      type: file
      source: validation/validate-owner-rule.sh
      hint: "Add an x-kubernetes-validations rule on spec with a rule that uses endsWith and the exact message."
    - name: status-subresource
      description: "The CRD serves a status subresource"
      type: file
      source: validation/validate-status-subresource.sh
      hint: "Add subresources with status: {} to the version in the CRD."

teardown:
  keepCluster: false
