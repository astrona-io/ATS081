apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environmentrequests.platform.starfleet.example
spec:
  group: platform.starfleet.example
  scope: Namespaced
  names:
    kind: EnvironmentRequest
    singular: environmentrequest
    plural: environmentrequests
    shortNames:
      - envreq
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.class
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - owner
              properties:
                owner:
                  type: string
                  description: Team that owns the environment. Must end with -team.
                class:
                  type: string
                  description: Size class. Supported values are small and medium.
                  enum:
                    - small
                    - medium
                  default: small
                ttlHours:
                  type: integer
                  description: Hours until the environment is removed, from 1 to 72.
                  minimum: 1
                  maximum: 72
                  default: 24
              x-kubernetes-validations:
                - rule: "self.owner.endsWith('-team')"
                  message: "owner must end with -team"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Ready
                    - Failed
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
