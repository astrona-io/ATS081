# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats081-040
course_id: ATS081
exam_code: CNPA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "AI/ML in Platform Automation"
questions:
  - id: ats081-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose tasks that suit an assistant"
    source_readings:
      - sections/section-040/module-01/course-01-where-ai-fits-in-platform-automation.md
    prompt: "Which task suits an AI assistant best?"
    options:
      - id: a
        text: "Applying a security policy to every cluster."
        explanation: "This needs tested and repeatable automation."
      - id: b
        text: "Summarizing a long incident timeline for the on-call engineer."
        explanation: "Correct. The input is messy and a person can check the result quickly."
      - id: c
        text: "Rotating a production certificate on its own."
        explanation: "A failure here is costly, so tested automation should do it."
      - id: d
        text: "Deleting expired environments without review."
        explanation: "This is a destructive action that needs deterministic rules."
    correct_option: b
    explanation: "Assistants suit tasks with messy input and results that a person can check. Costly actions belong to tested automation."

  - id: ats081-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain the split between proposing and doing"
    source_readings:
      - sections/section-040/module-01/course-01-where-ai-fits-in-platform-automation.md
    prompt: "What is the practical rule for the split of work between an assistant and the rest of the platform?"
    options:
      - id: a
        text: "The assistant decides what to propose, and tested automation and people decide what to do."
        explanation: "Correct. Proposals pass a reviewer before anything changes."
      - id: b
        text: "The assistant applies changes and people read the logs afterwards."
        explanation: "Changes happen before a person can stop them."
      - id: c
        text: "The assistant approves its own proposals when it is confident."
        explanation: "Confidence does not indicate that the answer is right."
      - id: d
        text: "People only review proposals from new assistants."
        explanation: "Review applies to every proposal."
    correct_option: a
    explanation: "A reviewer sits between the proposal and the change."

  - id: ats081-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe risks of input-steered behavior"
    source_readings:
      - sections/section-040/module-01/course-01-where-ai-fits-in-platform-automation.md
    prompt: "A log line contains text that looks like an instruction, and the assistant follows it. Which design limits the harm?"
    options:
      - id: a
        text: "A longer prompt that says to ignore instructions in logs."
        explanation: "Prompts cannot reliably stop an assistant from following input text."
      - id: b
        text: "Filtering all logs by hand."
        explanation: "This does not scale and still misses cases."
      - id: c
        text: "Running the assistant more slowly."
        explanation: "Speed is unrelated."
      - id: d
        text: "The assistant identity has no permission to cause the harm."
        explanation: "Correct. Authority must not depend on what the assistant reads."
    correct_option: d
    explanation: "You cannot reliably prevent a bad instruction from being followed. You can make sure that following it is harmless."

  - id: ats081-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the authority of an assistant"
    source_readings:
      - sections/section-040/module-01/course-01-where-ai-fits-in-platform-automation.md
    prompt: "Which command shows whether the assistant ServiceAccount can delete Deployments in starfleet, without running the assistant?"
    options:
      - id: a
        text: "kubectl describe deployment scout -n starfleet"
        explanation: "This describes a Deployment."
      - id: b
        text: "kubectl top pod -n assistant"
        explanation: "This shows resource use."
      - id: c
        text: "kubectl auth can-i delete deployments -n starfleet --as=system:serviceaccount:assistant:ops-assistant"
        explanation: "Correct. The API server evaluates the permission for that identity."
      - id: d
        text: "kubectl get serviceaccount ops-assistant -n assistant"
        explanation: "This shows that the account exists, not what it may do."
    correct_option: c
    explanation: "kubectl auth can-i with --as evaluates RBAC for another identity."

  - id: ats081-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Understand that RBAC is additive"
    source_readings:
      - sections/section-040/module-01/course-02-bounded-authority.md
    prompt: "A narrow Role and RoleBinding are added for the assistant, but it can still delete Deployments. What is the likely cause?"
    options:
      - id: a
        text: "The assistant is in the wrong namespace."
        explanation: "This does not explain extra permissions."
      - id: b
        text: "The old RoleBinding to the edit role still exists, and RBAC permissions add up."
        explanation: "Correct. Delete the old binding."
      - id: c
        text: "The new Role is invalid."
        explanation: "An invalid Role is rejected when it is applied."
      - id: d
        text: "RBAC deny rules override allow rules."
        explanation: "RBAC has no deny rules."
    correct_option: b
    explanation: "RBAC only adds permissions. Removing authority means removing the old binding."

  - id: ats081-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Separate what RBAC and admission control"
    source_readings:
      - sections/section-040/module-01/course-02-bounded-authority.md
    prompt: "The assistant may create ConfigMaps in assistant. What can RBAC not stop it from doing?"
    options:
      - id: a
        text: "Creating a proposal whose label says accepted."
        explanation: "Correct. RBAC limits verbs and resources, not the content of an object."
      - id: b
        text: "Deleting a proposal."
        explanation: "RBAC can deny the delete verb."
      - id: c
        text: "Creating ConfigMaps in starfleet."
        explanation: "RBAC can deny this by namespace."
      - id: d
        text: "Reading Secrets."
        explanation: "RBAC can deny this by resource."
    correct_option: a
    explanation: "Content rules need an admission policy."

  - id: ats081-040-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain how the policy recognizes the assistant"
    source_readings:
      - sections/section-040/module-01/course-02-bounded-authority.md
    prompt: "Which part of a ValidatingAdmissionPolicy lets the rule apply only to the assistant?"
    options:
      - id: a
        text: "The binding selects the Pod of the assistant."
        explanation: "Bindings select namespaces and objects, not the caller."
      - id: b
        text: "The policy name contains the word assistant."
        explanation: "A name has no effect on matching."
      - id: c
        text: "failurePolicy is set to Ignore."
        explanation: "failurePolicy controls evaluation errors."
      - id: d
        text: "The expression reads request.userInfo.username and compares it with the ServiceAccount identity."
        explanation: "Correct. For other callers the rule passes."
    correct_option: d
    explanation: "The request carries the caller identity in request.userInfo."

  - id: ats081-040-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Test a policy without storing objects"
    source_readings:
      - sections/section-040/module-01/course-02-bounded-authority.md
    prompt: "How can you test that the policy denies a proposal from the assistant without creating the object?"
    options:
      - id: a
        text: "Apply it and delete it later."
        explanation: "The object exists for a while and may be acted on."
      - id: b
        text: "Read the policy YAML carefully."
        explanation: "This does not test the behavior."
      - id: c
        text: "Send the manifest with kubectl create --dry-run=server --as=<assistant identity>."
        explanation: "Correct. A server dry run goes through authorization and admission."
      - id: d
        text: "Use kubectl create --dry-run=client."
        explanation: "A client dry run does not contact admission."
    correct_option: c
    explanation: "Server-side dry runs evaluate admission and still store nothing."

  - id: ats081-040-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compute the acceptance rate"
    source_readings:
      - sections/section-040/module-01/course-03-evaluation-and-feedback.md
    prompt: "A batch has 6 accepted, 2 rejected and 2 waiting proposals. What is the acceptance rate?"
    options:
      - id: a
        text: "25 percent"
        explanation: "This is the share rejected."
      - id: b
        text: "75 percent"
        explanation: "Correct. 6 divided by the 8 reviewed proposals is 0.75."
      - id: c
        text: "60 percent"
        explanation: "This counts the waiting proposals as not accepted."
      - id: d
        text: "80 percent"
        explanation: "This counts the waiting proposals as accepted."
    correct_option: b
    explanation: "Waiting proposals are not reviewed, so they stay out of the formula."

  - id: ats081-040-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Use rejection reasons"
    source_readings:
      - sections/section-040/module-01/course-03-evaluation-and-feedback.md
    prompt: "Several rejections have the reason unsafe, for actions such as scaling a production service to zero. What is the best response?"
    options:
      - id: a
        text: "Remove the action from what proposals may contain, so that it cannot be proposed."
        explanation: "Correct. An action that no reviewer should accept should not be possible."
      - id: b
        text: "Ask the reviewers to reject faster."
        explanation: "This keeps producing bad proposals."
      - id: c
        text: "Raise the assistant authority."
        explanation: "This moves in the wrong direction."
      - id: d
        text: "Ignore the reason and watch the rate."
        explanation: "The reason says what to change."
    correct_option: a
    explanation: "Reasons tell you how the assistant is wrong, and some failures are best prevented structurally."

  - id: ats081-040-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Decide the assistant mode"
    source_readings:
      - sections/section-040/module-01/course-03-evaluation-and-feedback.md
    prompt: "After 8 reviewed proposals the acceptance rate is 100 percent. The rule is at least 20 reviewed and 90 percent. What should the mode be?"
    options:
      - id: a
        text: "A mode without review, because the rate is perfect."
        explanation: "The sample is below the minimum."
      - id: b
        text: "Disabled, because 100 percent is suspicious in every case."
        explanation: "It is a reason to sample reviews, not to disable the assistant."
      - id: c
        text: "The mode does not matter."
        explanation: "The mode sets how much authority the assistant has."
      - id: d
        text: "suggest-only, because the sample is too small."
        explanation: "Correct. Eight proposals are not enough evidence."
    correct_option: d
    explanation: "Set a minimum number of reviewed proposals before widening authority."

