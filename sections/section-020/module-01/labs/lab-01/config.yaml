# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Complete The Starfleet Catalog (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-081-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state, including the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: drifter-entity
      description: "Entity drifter is a Component with lifecycle experimental, owner group:outpost-team and a dependency on component:scout"
      type: file
      source: validation/validate-drifter-entity.sh
      hint: "Create a CatalogEntity named drifter in the namespace catalog with spec.kind Component, lifecycle experimental, owner group:outpost-team and dependsOn component:scout."
    - name: no-dangling
      description: "No entity depends on an entity that does not exist, and scout, probe and shuttle are still registered"
      type: file
      source: validation/validate-no-dangling.sh
      hint: "List the dependsOn values with jq. Remove component:sensor-gateway from probe. Do not delete the entities that others depend on."
    - name: workload-labels
      description: "The Deployments scout, probe, shuttle and drifter carry the label catalog.starfleet.example/entity with their own name"
      type: file
      source: validation/validate-labels.sh
      hint: "Use kubectl label deployment NAME catalog.starfleet.example/entity=NAME in the namespaces starfleet and outpost."

teardown:
  keepCluster: false
