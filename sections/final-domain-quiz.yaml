# Final domain knowledge check across all four sections.
---
schema_version: 1
kind: question_bank
id: ats081-final
course_id: ATS081
exam_code: CNPA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: idps-and-developer-experience
  title: "IDPs and Developer Experience"
questions:
  - id: ats081-final-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose where a guardrail must live"
    source_readings:
      - sections/section-010/module-01/course-01-a-request-api-with-a-customresourcedefinition.md
    prompt: "A form in a portal rejects requests without an owner, but a developer sends a request with kubectl and it is accepted. What is the fix?"
    options:
      - id: a
        text: "Add a second form."
        explanation: "This does not change what the API server accepts."
      - id: b
        text: "Enforce the rule on the API server with a schema rule or an admission policy."
        explanation: "Correct. Every client meets the rule."
      - id: c
        text: "Make the form stricter."
        explanation: "Clients that skip the form are still not covered."
      - id: d
        text: "Tell developers to use the form."
        explanation: "A rule that depends on behavior is not enforced."
    correct_option: b
    explanation: "Correct. Every client meets the rule."

  - id: ats081-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare quota, limit range and admission policy"
    source_readings:
      - sections/section-010/module-01/course-02-guardrails-with-quota-limits-and-admission-policy.md
    prompt: "Which object sets a default memory limit for containers that declare none?"
    options:
      - id: a
        text: "A LimitRange."
        explanation: "Correct. It applies defaults and bounds per container."
      - id: b
        text: "A ResourceQuota."
        explanation: "A quota caps the total of a namespace and sets no defaults."
      - id: c
        text: "A ValidatingAdmissionPolicy."
        explanation: "A validating policy accepts or denies and does not change objects."
      - id: d
        text: "A RoleBinding."
        explanation: "This grants permissions."
    correct_option: a
    explanation: "Correct. It applies defaults and bounds per container."

  - id: ats081-final-q03
    type: single_choice
    difficulty: advanced
    learning_objective: "Test permissions by impersonation"
    source_readings:
      - sections/section-010/module-01/course-03-authorization-and-useful-request-status.md
    prompt: "Which command tests whether a group may create requests in a namespace?"
    options:
      - id: a
        text: "kubectl get rolebinding -n team-alpha"
        explanation: "This lists bindings and does not evaluate them."
      - id: b
        text: "kubectl describe quota -n team-alpha"
        explanation: "This shows quota use."
      - id: c
        text: "kubectl api-resources"
        explanation: "This lists resource types."
      - id: d
        text: "kubectl auth can-i create environmentrequests -n team-alpha --as=dev --as-group=team-alpha-developers"
        explanation: "Correct. The API server evaluates the permission for that identity."
    correct_option: d
    explanation: "Correct. The API server evaluates the permission for that identity."

  - id: ats081-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Judge the value of a catalog entry"
    source_readings:
      - sections/section-020/module-01/course-01-the-catalog-model-entities-owners-and-relationships.md
    prompt: "Which entry is least useful to a reader of the catalog?"
    options:
      - id: a
        text: "An entity that depends on another registered entity."
        explanation: "A resolved dependency is useful."
      - id: b
        text: "An entity reviewed last week."
        explanation: "A recent review is a good sign."
      - id: c
        text: "An entity whose owner is a placeholder such as group:unassigned."
        explanation: "Correct. Nobody can be asked about it."
      - id: d
        text: "An entity with a lifecycle of experimental."
        explanation: "The lifecycle tells the reader what to expect."
    correct_option: c
    explanation: "Correct. Nobody can be asked about it."

  - id: ats081-final-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Find a dangling reference"
    source_readings:
      - sections/section-020/module-01/course-02-the-catalog-as-an-api-in-kubernetes.md
    prompt: "The entity shuttle depends on resource:telemetry-db, and no such entity exists. What is this called and what is the repair?"
    options:
      - id: a
        text: "A duplicate. Delete shuttle."
        explanation: "The entity is not duplicated."
      - id: b
        text: "A dangling reference. Register the missing entity or remove the dependency if it is wrong."
        explanation: "Correct. The relationship must resolve to a real entity."
      - id: c
        text: "Drift. Restart the Deployment."
        explanation: "Drift compares the catalog with the cluster. Restarting changes nothing in the catalog."
      - id: d
        text: "A stale entry. Change the review date."
        explanation: "A review date does not create the missing entity."
    correct_option: b
    explanation: "Correct. The relationship must resolve to a real entity."

  - id: ats081-final-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Detect drift between cluster and catalog"
    source_readings:
      - sections/section-020/module-01/course-03-keeping-the-catalog-useful.md
    prompt: "A Deployment runs in the cluster and has no matching catalog entity. How do you detect this for every Deployment?"
    options:
      - id: a
        text: "Compare the Deployment labels or names with the entity names with jq."
        explanation: "Correct. A comparison finds every unmatched workload."
      - id: b
        text: "Read the catalog once a year."
        explanation: "This finds drift late."
      - id: c
        text: "Ask each team by email."
        explanation: "This does not scale and misses cases."
      - id: d
        text: "Delete unmatched Deployments."
        explanation: "This removes running software that nobody reviewed."
    correct_option: a
    explanation: "Correct. A comparison finds every unmatched workload."

  - id: ats081-final-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Separate the portal from the platform"
    source_readings:
      - sections/section-030/module-01/course-01-the-portal-and-the-platform.md
    prompt: "A portal is down. What should still work?"
    options:
      - id: a
        text: "Nothing, because the portal holds the rules."
        explanation: "Rules belong in the platform so that every client meets them."
      - id: b
        text: "Only the catalog data."
        explanation: "The portal does not own the data."
      - id: c
        text: "Only quota."
        explanation: "Quota is a Kubernetes object that exists without the portal."
      - id: d
        text: "Developers can still reach the platform APIs and create what they need."
        explanation: "Correct. The portal is one interface to the platform and not the platform."
    correct_option: d
    explanation: "Correct. The portal is one interface to the platform and not the platform."

  - id: ats081-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Test a template before use"
    source_readings:
      - sections/section-030/module-01/course-02-golden-paths-and-software-templates.md
    prompt: "Which test shows that a golden-path template produces a working service?"
    options:
      - id: a
        text: "Count the placeholders."
        explanation: "A count does not test behavior."
      - id: b
        text: "Check that the file name ends in yaml."
        explanation: "The name says nothing about the content."
      - id: c
        text: "Render it for a test service, apply it and check that the rollout finishes and the labels exist."
        explanation: "Correct. This tests the real result."
      - id: d
        text: "Read the template once."
        explanation: "A read does not show a runtime result."
    correct_option: c
    explanation: "Correct. This tests the real result."

  - id: ats081-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compute portal coverage"
    source_readings:
      - sections/section-030/module-01/course-03-adoption-and-freshness.md
    prompt: "Eight Deployments run and the portal lists six of them. What is the coverage?"
    options:
      - id: a
        text: "86 percent"
        explanation: "This divides by 7."
      - id: b
        text: "75 percent"
        explanation: "Correct. 6 divided by 8 is 0.75."
      - id: c
        text: "6 percent"
        explanation: "This is the count and not a percent."
      - id: d
        text: "25 percent"
        explanation: "This is the share that is missing."
    correct_option: b
    explanation: "Correct. 6 divided by 8 is 0.75."

  - id: ats081-final-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose tasks for an assistant"
    source_readings:
      - sections/section-040/module-01/course-01-where-ai-fits-in-platform-automation.md
    prompt: "Which task should stay with tested automation and not an assistant?"
    options:
      - id: a
        text: "Applying a security policy to every cluster."
        explanation: "Correct. A failure is costly, so the action must be repeatable."
      - id: b
        text: "Summarizing an incident timeline."
        explanation: "A person can check a summary."
      - id: c
        text: "Drafting a runbook update for review."
        explanation: "A reviewer sits between the draft and the change."
      - id: d
        text: "Suggesting a likely cause of an alert."
        explanation: "A suggestion changes nothing by itself."
    correct_option: a
    explanation: "Correct. A failure is costly, so the action must be repeatable."

  - id: ats081-final-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Bound authority with identity"
    source_readings:
      - sections/section-040/module-01/course-02-bounded-authority.md
    prompt: "Why is a narrow RBAC Role for the assistant more reliable than an instruction in its prompt?"
    options:
      - id: a
        text: "Roles are faster than prompts."
        explanation: "Speed is unrelated."
      - id: b
        text: "Prompts are ignored by Kubernetes."
        explanation: "The issue is enforcement and not what Kubernetes ignores."
      - id: c
        text: "A Role makes the assistant more accurate."
        explanation: "A Role limits authority and does not change accuracy."
      - id: d
        text: "The API server enforces the Role whatever the assistant reads or decides."
        explanation: "Correct. Authority does not depend on the behavior of the assistant."
    correct_option: d
    explanation: "Correct. Authority does not depend on the behavior of the assistant."

  - id: ats081-final-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Evaluate with an acceptance rate"
    source_readings:
      - sections/section-040/module-01/course-03-evaluation-and-feedback.md
    prompt: "Five proposals were accepted, one was rejected and four wait. What is the acceptance rate and is the mode widened under a rule of 20 reviewed proposals and 90 percent?"
    options:
      - id: a
        text: "100 percent, and the mode is widened."
        explanation: "This ignores the rejected proposal."
      - id: b
        text: "83 percent, and the mode is widened."
        explanation: "The rate is below 90 and the sample is too small."
      - id: c
        text: "About 83 percent, and the mode stays suggest-only because only 6 were reviewed."
        explanation: "Correct. 5 divided by 6 is about 83, and the sample is too small."
      - id: d
        text: "50 percent, and the mode is widened."
        explanation: "This counts the waiting proposals, and the sample is too small."
    correct_option: c
    explanation: "Correct. 5 divided by 6 is about 83, and the sample is too small."

  - id: ats081-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Fix Pods rejected by a compute quota"
    source_readings:
      - sections/section-010/module-02/course-02-quota-and-default-limits-per-tenant.md
    prompt: "A new tenant namespace has a ResourceQuota for requests.cpu but developers report that Pods without a resources block are rejected. What is the smallest fix?"
    options:
      - id: a
        text: "Add a LimitRange with default requests and limits."
        explanation: "Correct. A LimitRange adds defaults at admission, so the quota can count the values."
      - id: b
        text: "Remove the quota."
        explanation: "Not correct. This removes the guardrail."
      - id: c
        text: "Ask developers to use a portal form."
        explanation: "Not correct. A form does not change what the API server requires."
      - id: d
        text: "Label the namespace with a tenant label."
        explanation: "Not correct. A label changes no admission rule."
    correct_option: a
    explanation: "A LimitRange adds defaults at admission, so the quota can count the values."

  - id: ats081-final-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Diagnose an ineffective NetworkPolicy"
    source_readings:
      - sections/section-010/module-02/course-03-network-and-pod-isolation.md
    prompt: "A default-deny ingress NetworkPolicy exists in a tenant namespace, yet a Pod in another namespace still reaches its Pods. What should the platform team check first?"
    options:
      - id: a
        text: "Whether the network plugin enforces NetworkPolicy."
        explanation: "Correct. The plugin enforces policies, and the API server accepts the object even when nothing enforces it."
      - id: b
        text: "Whether the namespace has a quota."
        explanation: "Not correct. A quota does not affect traffic."
      - id: c
        text: "Whether the policy name ends in deny."
        explanation: "Not correct. Names have no meaning to the plugin."
      - id: d
        text: "Whether the Pod has a readiness probe."
        explanation: "Not correct. Probes do not affect policy."
    correct_option: a
    explanation: "The plugin enforces policies, and the API server accepts the object even when nothing enforces it."

  - id: ats081-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find a dangling reference"
    source_readings:
      - sections/section-020/module-02/course-03-entity-references-and-relations.md
    prompt: "A catalog report shows a Component whose dependsOn names component:default/scouts, but the entity is named scout. Which statement is correct?"
    options:
      - id: a
        text: "The reference dangles, and the catalog still stores the relation."
        explanation: "Correct. A reference to a missing entity is a dangling reference."
      - id: b
        text: "The catalog renames the entity to scouts."
        explanation: "Not correct. The catalog does not change names."
      - id: c
        text: "The Component loses its owner."
        explanation: "Not correct. Owner and dependency are separate fields."
      - id: d
        text: "The reverse relation is created on scout."
        explanation: "Not correct. The target scouts does not exist."
    correct_option: a
    explanation: "A reference to a missing entity is a dangling reference."

  - id: ats081-final-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Separate facts from derived relations"
    source_readings:
      - sections/section-020/module-02/course-03-entity-references-and-relations.md
    prompt: "A team writes ownedBy relations by hand in its catalog-info.yaml. What is the problem?"
    options:
      - id: a
        text: "Descriptors state facts such as spec.owner, and the catalog derives relations itself."
        explanation: "Correct. Facts go in descriptors and relations are derived."
      - id: b
        text: "Relations are only allowed in Location entities."
        explanation: "Not correct. A Location lists targets, not relations."
      - id: c
        text: "ownedBy is always rejected by YAML."
        explanation: "Not correct. The format is valid YAML, but it is not a descriptor field."
      - id: d
        text: "Relations must be written in the portal."
        explanation: "Not correct. They are derived, not written."
    correct_option: a
    explanation: "Facts go in descriptors and relations are derived."

  - id: ats081-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Complete a template with registration"
    source_readings:
      - sections/section-030/module-02/course-03-steps-actions-and-outputs.md
    prompt: "A template publishes a repository, but new services never show up in the portal catalog. Which change fixes this?"
    options:
      - id: a
        text: "Add a catalog:register step after the publish step."
        explanation: "Correct. Registration is a separate action that needs the output of the publish step."
      - id: b
        text: "Add a longer description to the template."
        explanation: "Not correct. A description has no effect on registration."
      - id: c
        text: "Move the owner to the first page."
        explanation: "Not correct. The owner field does not register entities."
      - id: d
        text: "Change apiVersion of the template."
        explanation: "Not correct. The version does not add steps."
    correct_option: a
    explanation: "Registration is a separate action that needs the output of the publish step."

  - id: ats081-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place enforcement beyond the form"
    source_readings:
      - sections/section-030/module-02/course-02-parameters-validation-and-form-fields.md
    prompt: "The portal form for a template limits the service name with a pattern. A script calls the Scaffolder API with an invalid name. Where must the rule also be enforced?"
    options:
      - id: a
        text: "On the system that receives the value, such as the repository host or an admission policy."
        explanation: "Correct. A form guides users, and the receiving side enforces."
      - id: b
        text: "Only in the form."
        explanation: "Not correct. Other clients skip the form."
      - id: c
        text: "Only in the documentation."
        explanation: "Not correct. Documentation enforces nothing."
      - id: d
        text: "In the portal theme."
        explanation: "Not correct. Themes only change appearance."
    correct_option: a
    explanation: "A form guides users, and the receiving side enforces."

  - id: ats081-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the state of an unschedulable GPU Pod"
    source_readings:
      - sections/section-040/module-02/course-02-accelerators-as-extended-resources.md
    prompt: "A cluster has no GPU nodes. A Pod with limits nvidia.com/gpu: 1 is created in a namespace. What state does the Pod reach?"
    options:
      - id: a
        text: "Pending, with a FailedScheduling event."
        explanation: "Correct. The scheduler finds no node that advertises the resource."
      - id: b
        text: "Running on the CPU."
        explanation: "Not correct. Nothing replaces the device."
      - id: c
        text: "Succeeded."
        explanation: "Not correct. The container never starts."
      - id: d
        text: "Terminating."
        explanation: "Not correct. The Pod is not removed."
    correct_option: a
    explanation: "The scheduler finds no node that advertises the resource."

  - id: ats081-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Combine quota, priority and queueing"
    source_readings:
      - sections/section-040/module-02/course-03-training-jobs-queues-and-priorities.md
    prompt: "The ML team submits many training Jobs and wants fair sharing of GPUs between teams without anyone evicting a running Job. Which combination fits?"
    options:
      - id: a
        text: "A quota per namespace, a PriorityClass with preemptionPolicy Never and a queueing system that uses suspend."
        explanation: "Correct. Quota limits each team, the policy avoids eviction and the queue admits Jobs when capacity is free."
      - id: b
        text: "One shared namespace with no limits."
        explanation: "Not correct. This lets one team take all devices."
      - id: c
        text: "A Deployment with a high priority for every Job."
        explanation: "Not correct. Training is a batch workload, and a high priority could evict others."
      - id: d
        text: "Manual messages between teams."
        explanation: "Not correct. This does not scale."
    correct_option: a
    explanation: "Quota limits each team, the policy avoids eviction and the queue admits Jobs when capacity is free."

