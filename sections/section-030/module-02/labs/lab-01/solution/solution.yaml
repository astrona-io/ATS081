apiVersion: v1
kind: ConfigMap
metadata:
  name: scaffolder-templates
  namespace: portal
data:
  template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: starfleet-service
      title: Starfleet Service
      description: Creates a service with the platform rules
    spec:
      owner: group:default/platform-team
      type: service
      parameters:
        - title: Service details
          required:
            - name
            - owner
          properties:
            name:
              title: Name
              type: string
              pattern: '^[a-z][a-z0-9-]{2,30}$'
            owner:
              title: Owner
              type: string
      steps:
        - id: fetch
          name: Fetch skeleton
          action: fetch:template
          input:
            url: ./skeleton
            values:
              name: ${{ parameters.name }}
              owner: ${{ parameters.owner }}
        - id: publish
          name: Publish repository
          action: publish:github
          input:
            repoUrl: github.com?owner=starfleet&repo=${{ parameters.name }}
        - id: register
          name: Register in the catalog
          action: catalog:register
          input:
            repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
            catalogInfoPath: /catalog-info.yaml
      output:
        links:
          - title: Open in catalog
            icon: catalog
            entityRef: ${{ steps['register'].output.entityRef }}
