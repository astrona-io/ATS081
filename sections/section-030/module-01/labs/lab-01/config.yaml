# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Refresh The Portal Service List (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-081-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - nginx:1.27-alpine

bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state, including the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: served-services
      description: "The portal serves a list with the services scout, probe, shuttle and drifter"
      type: file
      source: validation/validate-served-services.sh
      hint: "Edit the ConfigMap portal-catalog in the namespace portal. The mounted file updates after up to about a minute, so the check retries."
    - name: owners
      description: "Every served entry has a real owner, probe is owned by starfleet-team and drifter by outpost-team"
      type: file
      source: validation/validate-owners.sh
      hint: "Replace the owner unassigned. Every entry needs name, owner, lifecycle and docs."
    - name: fresh
      description: "The served updated date is 2026-11-01 or later"
      type: file
      source: validation/validate-fresh.sh
      hint: "Change the updated field together with the list. Use the format YYYY-MM-DD."

teardown:
  keepCluster: false
