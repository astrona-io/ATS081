        title: "Harden The EnvironmentRequest API Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: self-service
        task_kind: build
        tags: [crd, schema, cel, enum, defaults, status-subresource]
        learning_goals:
          - Restrict request fields with an enum, defaults and bounds
          - Reject a wrong owner with a readable CEL rule message
          - Enable the status subresource
        resources:
          - name: "Custom Resources"
            url: https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
          - name: "CRD validation rules"
            url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/#validation-rules
