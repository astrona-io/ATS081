# Course manifest for ATS081. Each section lists its README, a module (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone and a quiz.
training:
  id: ATS081
  title: 'CNPA: IDPs and Developer Experience'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and original scenario quizzes
    covering the published objectives of this CNPA domain. Labs run on kind (Kubernetes 1.35) and are untested.
  certification:
    name: Certified Cloud Native Platform Engineering Associate
    code: CNPA
    provider: CNCF / Linux Foundation
    domain: IDPs and Developer Experience
    weight: 8
    competencies:
    - Simplified Access to Platform Capabilities
    - API-Driven Service Catalogs
    - Developer Portals for Platform Adoption
    - AI/ML in Platform Automation
modules:
  - id: module-intro
    title: Introduction
    description: Audience, reading method and review process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
    - type: reading
      title: Welcome To The Course
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: Get Your Machine Ready
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: How This Course Is Made
      path: sections/intro/course-03-how-this-course-is-made.md
  - id: module-010
    title: "Simplified Access to Platform Capabilities"
    description: >
      Makes the reader able to offer a platform capability as a self-service request: a request kind with a schema, defaults and validation rules, server-side guardrails (quota, limits and admission policy) with useful rejection messages, team permissions with RBAC, and request status that tells the user what happens.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-010/README.md

      - type: reading
        title: "Self-Service Requests, Guardrails And Useful Status"
        path: sections/section-010/module-01/course.md
