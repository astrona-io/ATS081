        difficulty: intermediate
        estimated_duration: 25m
        topic: tenant-isolation
        task_kind: build
        tags: [namespace, resourcequota, limitrange, networkpolicy, pod-security]
        learning_goals:
          - Label a namespace as a tenant and enforce the baseline Pod Security level
